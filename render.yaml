services:
  - type: web
    name: sabor-mineiro-ack
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sabor-mineiro-db
          property: connectionString

databases:
  - name: sabor-mineiro-db
    plan: free
    databaseName: sabor_mineiro
    user: sabor
